<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CVE Pipeline{% endblock %} — kernel-cve-pipeline</title>
  <style>
    :root {
      --bg:          #ffffff;
      --bg2:         #f6f8fa;
      --bg3:         #eaeef2;
      --border:      #d0d7de;
      --border-soft: #e8ecf0;
      --text:        #1f2328;
      --muted:       #57606a;
      --muted2:      #8c959f;

      --green:       #1a7f37;
      --green-bg:    #dafbe1;
      --green-border:#aceebb;

      --blue:        #0969da;
      --blue-bg:     #ddf4ff;
      --blue-border: #80ccff;

      --orange:      #953800;
      --orange-bg:   #fff1e5;
      --orange-border:#ffa657;

      --red:         #cf222e;
      --red-bg:      #ffebe9;
      --red-border:  #ffaba8;

      --yellow:      #7d4e00;
      --yellow-bg:   #fff8c5;
      --yellow-border:#f0c000;

      --purple:      #6639ba;
      --purple-bg:   #fbefff;

      --font-mono: 'SFMono-Regular', 'Consolas', 'Liberation Mono', monospace;
      --font-ui:   -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;

      --shadow-sm: 0 1px 3px rgba(31,35,40,0.08);
      --shadow:    0 3px 10px rgba(31,35,40,0.10);
      --radius:    8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      background: var(--bg2);
      color: var(--text);
      font-family: var(--font-ui);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── nav ── */
    nav {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .nav-brand {
      font-family: var(--font-mono);
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      margin-right: 2.5rem;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav-brand .brand-icon {
      width: 28px; height: 28px;
      background: var(--text);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: var(--bg);
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .nav-links { display: flex; gap: 0; flex: 1; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      padding: 0 1rem;
      height: 60px;
      display: flex;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.active { color: var(--text); border-bottom-color: var(--blue); }
    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 0.75rem; }

    /* ── badges ── */
    .badge {
      display: inline-flex; align-items: center;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid;
      white-space: nowrap;
    }
    .badge.green  { background: var(--green-bg);  color: var(--green);  border-color: var(--green-border); }
    .badge.blue   { background: var(--blue-bg);   color: var(--blue);   border-color: var(--blue-border); }
    .badge.orange { background: var(--orange-bg); color: var(--orange); border-color: var(--orange-border); }
    .badge.red    { background: var(--red-bg);    color: var(--red);    border-color: var(--red-border); }
    .badge.yellow { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-border); }
    .badge.muted  { background: var(--bg3);       color: var(--muted);  border-color: var(--border); }

    /* ── layout ── */
    .page { max-width: 1320px; margin: 0 auto; padding: 2.5rem 2rem; }
    .page-header { margin-bottom: 2rem; }
    .page-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      line-height: 1.3;
    }
    .page-header p { color: var(--muted); margin-top: 0.4rem; font-size: 1rem; }

    /* ── cards ── */
    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .card-header {
      padding: 1rem 1.4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: var(--bg2);
    }
    .card-header h2, .card-header h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .card-body { padding: 1.4rem; }

    /* ── grid ── */
    .grid { display: grid; gap: 1.25rem; }
    .grid-2 { grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }

    /* ── stage pipeline ── */
    .pipeline {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0;
    }
    .pipeline-step {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.82rem;
      font-family: var(--font-mono);
      color: var(--muted2);
      font-weight: 500;
    }
    .pipeline-step.done   { color: var(--green); }
    .pipeline-step.active { color: var(--orange); }
    .pipeline-step .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }
    .pipeline-step.done   .dot { background: var(--green); }
    .pipeline-step.active .dot { background: var(--orange); animation: pulse 1.5s infinite; }
    .pipeline-arrow { color: var(--border); margin: 0 0.3rem; font-size: 0.75rem; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── tables ── */
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th {
      text-align: left;
      padding: 0.75rem 1.1rem;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
    }
    td {
      padding: 0.8rem 1.1rem;
      border-bottom: 1px solid var(--border-soft);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg2); }
    td a { color: var(--blue); text-decoration: none; font-weight: 500; }
    td a:hover { text-decoration: underline; }

    /* ── buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1.1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid;
      text-decoration: none;
      transition: filter 0.15s;
      white-space: nowrap;
      font-family: var(--font-ui);
    }
    .btn:hover { filter: brightness(0.93); }
    .btn-green  { background: var(--green-bg);  color: var(--green);  border-color: var(--green-border); }
    .btn-blue   { background: var(--blue-bg);   color: var(--blue);   border-color: var(--blue-border); }
    .btn-orange { background: var(--orange-bg); color: var(--orange); border-color: var(--orange-border); }
    .btn-red    { background: var(--red-bg);    color: var(--red);    border-color: var(--red-border); }
    .btn-muted  { background: var(--bg3);       color: var(--muted);  border-color: var(--border); }
    .btn-solid  { background: var(--text);      color: var(--bg);     border-color: var(--text); }

    /* ── form elements ── */
    input[type=text], select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.5rem 0.85rem;
      font-size: 0.95rem;
      font-family: var(--font-ui);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type=text]:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(9,105,218,0.12);
    }
    label { font-size: 0.88rem; color: var(--muted); display: block; margin-bottom: 0.35rem; font-weight: 500; }
    .form-row { margin-bottom: 1.25rem; }
    .form-check { display: flex; align-items: center; gap: 0.5rem; }
    .form-check input[type=checkbox] { accent-color: var(--blue); width: 16px; height: 16px; }
    .form-check label { margin: 0; cursor: pointer; color: var(--text); font-size: 0.9rem; }

    /* ── terminal / log ── */
    .terminal {
      background: #1b1f23;
      border: 1px solid #30363d;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.6;
      padding: 1.25rem;
      overflow-x: auto;
      overflow-y: auto;
      color: #c9d1d9;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* ── prose / markdown ── */
    .prose { font-size: 1rem; line-height: 1.8; color: var(--text); }
    .prose h1,.prose h2,.prose h3,.prose h4 {
      color: var(--text); margin: 2rem 0 0.75rem; line-height: 1.3;
    }
    .prose h1 { font-size: 1.9rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; }
    .prose h2 { font-size: 1.45rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
    .prose h3 { font-size: 1.15rem; color: var(--blue); }
    .prose h4 { font-size: 1rem; color: var(--muted); }
    .prose p  { margin: 0.9rem 0; }
    .prose a  { color: var(--blue); text-decoration: none; font-weight: 500; }
    .prose a:hover { text-decoration: underline; }
    .prose code {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.15em 0.45em;
      font-family: var(--font-mono);
      font-size: 0.88em;
      color: var(--orange);
    }
    .prose pre {
      background: #1b1f23;
      border: 1px solid #30363d;
      border-radius: var(--radius);
      padding: 1.25rem;
      overflow-x: auto;
      margin: 1.25rem 0;
    }
    .prose pre code {
      background: none; border: none; padding: 0;
      font-size: 0.88rem; color: #c9d1d9;
    }
    .prose table { margin: 1.25rem 0; font-size: 0.92rem; }
    .prose blockquote {
      border-left: 4px solid var(--blue-border);
      padding: 0.5rem 1rem;
      color: var(--muted);
      margin: 1rem 0;
      background: var(--blue-bg);
      border-radius: 0 6px 6px 0;
    }
    .prose ul, .prose ol { padding-left: 1.75rem; margin: 0.6rem 0; }
    .prose li { margin: 0.3rem 0; }
    .prose hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    .prose details { margin: 0.5rem 0; }
    .prose summary { cursor: pointer; color: var(--blue); font-weight: 500; }
    .prose strong { font-weight: 700; }

    /* ── misc ── */
    .mono   { font-family: var(--font-mono); }
    .muted  { color: var(--muted); }
    .small  { font-size: 0.85rem; }
    .flex   { display: flex; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .flex-gap     { display: flex; align-items: center; gap: 0.6rem; }
    .mt1 { margin-top: 0.5rem; }
    .mt2 { margin-top: 1.25rem; }
    .mt3 { margin-top: 2rem; }
    .gap  { gap: 1rem; }
    .gap2 { gap: 1.5rem; }
    .w100 { width: 100%; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted2); }

    /* tabs */
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; gap: 0; }
    .tab-btn {
      padding: 0.65rem 1.2rem;
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s;
      font-family: var(--font-ui);
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--blue); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* status dot */
    .status-dot {
      display: inline-block;
      width: 9px; height: 9px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
    .status-dot.running { background: var(--orange); animation: pulse 1.5s infinite; }
    .status-dot.done    { background: var(--green); }
    .status-dot.failed  { background: var(--red); }
    .status-dot.killed  { background: var(--muted2); }

    /* ── empty state ── */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }
    .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .empty-state p { font-size: 1rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav>
  <a class="nav-brand" href="/">
    <div class="nav-brand-icon" style="width:28px;height:28px;background:var(--text);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--bg);font-size:0.8rem;font-weight:900;flex-shrink:0;">K</div>
    kernel-cve-pipeline
  </a>
  <div class="nav-links">
    <a href="/"        {% if request.path == '/'                         %}class="active"{% endif %}>Dashboard</a>
    <a href="/blogs"   {% if request.path.startswith('/blogs')           %}class="active"{% endif %}>Blogs</a>
    <a href="/diffs"   {% if request.path.startswith('/diffs')           %}class="active"{% endif %}>Diffs</a>
    <a href="/binaries"{% if request.path.startswith('/binaries')        %}class="active"{% endif %}>Binaries</a>
    <a href="/logs"    {% if request.path.startswith('/logs')            %}class="active"{% endif %}>Logs</a>
    <a href="/tasks"   {% if request.path.startswith('/tasks')           %}class="active"{% endif %}>Tasks</a>
  </div>
  <div class="nav-right">
    <a href="/tasks/new" class="btn btn-solid">+ New Task</a>
  </div>
</nav>
{% block body %}{% endblock %}
<script>
function tabs(containerId) {
  const c = document.getElementById(containerId);
  if (!c) return;
  c.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      c.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      c.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      c.querySelector('#' + btn.dataset.tab).classList.add('active');
    });
  });
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
